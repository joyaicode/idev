schema_version: 1
id: weekly-trace-audit
needs_ticket: false
aliases:
  - 周审计
  - 审计 traces
  - weekly audit
  - 跑 idev 周审计
summary: 对最近 50 条 idev traces 做纪律抽检并输出报告（不改票、不签字）。
risk_tier: P2
params: []
policy:
  on_fail: stop
  on_gate: stop
steps:
  - id: audit
    kind: shell.confirmed
    with:
      cmd: bash ~/.cursor/skills/idev/scripts/audit-traces.sh 50
    label: 跑 audit-traces.sh 50
  - id: note
    kind: human.gate
    label: 若有 multi-exec-calls / seal-write-without-signoff，人工点开样本；深读统计可忽略
    with:
      will_write: []
      proof: "audit-traces hard 计数"
