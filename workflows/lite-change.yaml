schema_version: 1
id: lite-change
aliases:
  - 轻量改动
  - 小改
  - 小改动
  - 小修
  - lite change
  - lite-change
  - 对这个 diff 走轻量
summary: >-
  小改捷径（不改 goal/baseline）：定界论证 → 编码纪律 → 同一波起草用例、自测、独立审查、验收索引 → 改掉 I* → 复跑并回写用例状态。计划无信号则自动过，不单独请签。审查不另设人闸。跑完停在实现审核；通过后才走 test-pack。禁止跳签、改密封正文、自动 promote。产线自己的小改踩坑写在该仓 .idev/pack/，挂到 extensions.yaml 的 code 阶段，由 session-context 打开。
risk_tier: P1
params:
  - name: feature
    required: true
    from: user
  - name: mode
    required: false
    from: default
    default: selftest
policy:
  on_fail: stop
  on_gate: stop
steps:
  - id: preflight
    kind: preflight.inputs
    label: 前置探针（票/路径/配方依赖可读；缺则 BLOCKED）
  - id: scope-guard
    kind: route.s4
    label: 确认不改 goal/baseline；小范围论证后改码
  - id: code-pass
    kind: deliver.code_pass
    label: 编码纪律与 review
  - id: plan
    kind: verify.plan
    group: check
    writes: ["verify/plan.yaml"]
    with: { mode: selftest }
    label: 起草测试用例（与审查、自测、验收索引并行）
  - id: run
    kind: verify.run
    group: check
    writes: ["verify/selftest.md"]
    with: { mode: selftest }
    label: 自测（只写自测报告，不改用例文件）
  - id: review
    kind: review.report
    group: check
    writes: ["review.md"]
    label: 独立审查（只写 review.md）
  - id: accept
    kind: verify.run
    group: check
    writes: ["verify/accept.md"]
    with: { mode: selftest }
    label: 验收索引（只写验收报告，不改用例、不写 aligned）
  - id: gate-plan
    kind: human.gate
    label: 人 accepted plan（已 accepted 且未改则跳过）
    with:
      will_write: ["verify/plan.yaml accepted"]
      proof: "verify-plan 门禁结果 / case 数"
      auto_tiers: [P0, P1, P2]
  - id: fix
    kind: review.fix
    label: 按审查清单改掉全部 I*（实现审核前，不另请签）
    with:
      accept_all_findings: true
  - id: refresh
    kind: verify.run
    with: { mode: selftest }
    label: 审查修改之后复跑，回写 plan.yaml 的 status，并重写 selftest.md 与 accept.md
  - id: gate-review
    kind: human.gate
    label: 实现审核（自测已跑完；确认后才提测，这里不签测试结果）
    with:
      will_write: ["deliver.semantic_gate.code", "deliver.stage=test"]
      proof: "check-feature code；refresh 回写后的 PASS/FAIL/UNPROVEN"
