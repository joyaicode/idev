schema_version: 1
tools:
  - id: stage-gate
    summary: 七视角拒过清单里可机检的那一半。调用时自己补 --feature。
    limit: 不写签字，不改票。
    command: python3 scripts/stage-gate.py
    inputs: [feature]
  - id: termview
    summary: 终端渲染原语（颜色/OSC 8 超链/对齐表格）。人看的脚本输出用它；管道与 golden 走纯文本通道，字节不变。
    limit: 只渲染，不判定、不打分；非 TTY 或 NO_COLOR 必须降级为纯文本。
    command: python3 scripts/lib/termview.py
  - id: req-ground
    summary: 核对一条需求落在哪些符号上。调用时自己补 --feature。
    limit: 不改代码。
    command: python3 scripts/req-ground.py
  - id: hypothesis
    summary: 根因假设台账。调用时自己补子命令和 --feature。
    limit: 不把假设当成根因。
    command: python3 scripts/hypothesis.py
  - id: lessons
    summary: 经验台账的召回、候选和升级。调用时自己补子命令。
    limit: 召回不是结论，不能自己 promote。
    command: python3 scripts/lessons.py
  - id: realign
    summary: 需求订正后看全线有没有还挂在旧 item 上。调用时自己补 --feature。
    limit: 不改需求正文。
    command: python3 scripts/realign.py
  - id: annotate
    summary: 人写在方案文档里的标注和它们的处置。调用时自己补子命令和 --feature。
    limit: 不改标注原文，不替人决定标注该不该接受。
    command: python3 scripts/annotate.py
    inputs: [feature]
  - id: process-eval
    summary: 停问前判断这一步低效、不合理，还是较弱模型的补丁。调用时自己补 stop 或 scan。
    limit: 不改 Skill，不打分，不把草案当已落地。
    command: python3 scripts/process-eval.py
  - id: instrument
    summary: 插桩登记台账（有界运行时取证）。调用时自己补子命令和 --feature。
    limit: 加桩先挂 H#；收尾全 removed 才过；check 有 active 即退出 1。
    command: python3 scripts/instrument.py
  - id: suspect-changes
    summary: 变更窗归因：时间窗 × 变更记录（可选 × 产物差异交集）→ 嫌疑清单。
    limit: 只提名不立案；--window-source 必填（问题发生/告警/数据更新时间）。
    command: python3 scripts/suspect-changes.py
  - id: review-findings
    summary: review.md 的 finding 台账：四态解析 / 锚点与驳回理由机检 / 一行统计。
    limit: 只读 review.md，不改它；check 退出 1 = 有发现。
    command: python3 scripts/review-findings.py
  - id: review-lessons
    summary: 已解决 finding → lessons 候选（六问齐才落，人 promote 才权威）。
    limit: 不自动入库；六问缺项只打印不落账。
    command: python3 scripts/review-lessons.py
groups:
  - id: evidence
    summary: 论证用的工具。配方写 tool_group 就会按这个顺序展开成步骤。
    tools: [stage-gate, hypothesis, lessons]
  - id: align
    summary: 需求落点和订正后的重新对准。
    tools: [req-ground, realign]
