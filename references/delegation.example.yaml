# 委派留痕的样例。契约见 references/agents-evolve.md 第一节。
#
# 落点:<票目录>/workflow/delegations/<run_id>/<step-id>-<attempt>.yaml
# 写入:python3 scripts/delegation.py write --feature <f>   # 本文件内容走 stdin
# 复核者的留痕另加 role: verifier(step / kind 与写手相同),落成
# <step-id>-<attempt>.verify.yaml,attempt 取它复核的那份写手留痕。
#
# brief 与 report 都存原文,不存摘要 —— 留痕的全部价值在于能照原样再派一次。
schema_version: 1
feature: example-change
step: report
kind: review.report
agent: idev-reviewer
at: 2026-10-12T22:30:00+08:00
attempt: 1

# 时序:导体在委派前后各记一次。可选 —— 可观测性不做成门禁,但没有它
# timeline 与 agent-eval 的耗时列是空的,"哪个 agent 慢"就答不出来。
# duration_s 由 delegation.py 从两端算出并写回,不用手填。
started_at: 2026-10-12T22:26:55+08:00
finished_at: 2026-10-12T22:30:00+08:00
duration_s: 185

# 委派包原文。attempt > 1 时 prior_failure 必填,否则 delegation.py write 拒收。
brief:
  ticket_home: docs/task/example-change
  repo: ~/go/src/coding.example.com/product
  stage: code
  risk_tier: P1
  must_read: conventions/coding.md
  idev_root: ~/.cursor/skills/idev           # coder/verifier/ops 必填($IDEV)
  with: {}
  prior_failure: ""

# agent 回报原文。raw 要全文,不要只留摘要。
report:
  status: PASS
  evidence: docs/task/example-change/review.md
  raw: |
    STATUS: PASS
    EVIDENCE: docs/task/example-change/review.md
    FACTS: codegraph 查到 OrderService.java:cancel 的调用方;git diff master...HEAD 输出
    DOC_DRIFT: 无
    ASSUMED: 无
    FINDINGS: 3(blocking 1 / 一般 2)
    UNRELATED: 2
    CHECKS: evidence-present=PASS  no-signoff-write=PASS  report-parsed=PASS
    SUGGEST:
    CONCLUSION: 认出 Java,扫到 1 条 blocking(C7 catch 后返回空),已标待签收。

# 产出计量:导体从回报里摘关键数字。扁平 map,只许数字或短字符串 ——
# 嵌套结构会把它变成第二套 eval,delegation.py 的 metrics-shape 会拒。
# 字段名各 agent 自定(reviewer 记 findings,coder 记 files_changed,
# verifier 记 cases_run),agent-eval 按字段名求和。
metrics:
  findings: 3
  blocking: 1
  unrelated: 2

# 可机检由 delegation.py 自己算并写回,不要手填;checker 是算它们的检查器版本。
# brief-complete 的失败指向导体,其余指向 agent;归 agent 的 FAIL 会挡这一步的 record PASS。
checks:
  evidence-present: PASS
  no-signoff-write: PASS
  brief-complete: PASS
  report-parsed: PASS
checker: 7e1ade222e4c

outcome: recorded      # recorded | rejected | retried
suggest: ""            # 回报 SUGGEST 行原文,只记不执行;同一个脚本、agent 或 kind 被点名 2 次才走提案
conclusion: 认出 Java,扫到 1 条 blocking(C7 catch 后返回空),已标待签收。  # 回报 CONCLUSION 行原文,由脚本写回
