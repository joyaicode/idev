# Shared signoff cases: Python reads this today, Go reads it from P1 on.
#
# The point of one file is that the two implementations cannot drift while
# both exist. `scripts/test_signoff.py` and `internal/domain/signoff` must
# agree on every row here.
#
# The `confirm` rows marked `source: design-10.3` are the table in
# design/idev-refactor-design-v3.md §10.3 verbatim (in-repo since
# 2026-10-19; formerly ~/Downloads/idev-refactor-design.md); four of them
# pass under the old prefix matcher and must not.
#
# `human` rows assume whitelist mode: test/signoff/people.yaml lists exactly
# wangwei794, tester, 张三 and Alice, and both runners build the identity
# from that file, so a name is a person only when the file says so — and
# the blacklist still applies first (listing a model there would not help).
# config/people.yaml signs real gates and lists none of the test names.
schema_version: 1
mode: whitelist

confirm:
  # --- design §10.3, the authoritative table -------------------------------
  - { quote: "确认", ok: true, reason: ok, source: design-10.3 }
  - { quote: "全签!", ok: true, reason: ok, source: design-10.3 }
  - { quote: "LGTM。", ok: true, reason: ok, source: design-10.3 }
  - { quote: "同意", ok: true, reason: ok, source: design-10.3 }
  - { quote: "确认 origin=code", gate_type: defect_origin, origin: code,
      ok: true, reason: ok, source: design-10.3 }
  - { quote: "确认 origin=arch", gate_type: defect_origin, origin: code,
      ok: false, reason: keyword-mismatch, source: design-10.3 }
  # These four were True under `low.startswith(word)`.
  - { quote: "确认不了", ok: false, reason: unparsed-tail, source: design-10.3, regression: true }
  - { quote: "同意吗", ok: false, reason: question, source: design-10.3, regression: true }
  - { quote: "LGTM but wait", ok: false, reason: unparsed-tail, source: design-10.3, regression: true }
  - { quote: "确认？", ok: false, reason: question, source: design-10.3, regression: true }
  - { quote: "继续", ok: false, reason: no-verb, source: design-10.3 }
  - { quote: "通过", ok: true, reason: ok }
  - { quote: "通过了", ok: true, reason: ok }
  - { quote: "通过。", ok: true, reason: ok }
  - { quote: "架构通过", ok: true, reason: ok }
  - { quote: "需求通过", ok: true, reason: ok }
  - { quote: "实现通过", ok: true, reason: ok }
  - { quote: "提测通过", ok: true, reason: ok }
  - { quote: "审核通过", ok: true, reason: ok }
  - { quote: "通过不了", ok: false, reason: unparsed-tail }
  - { quote: "通过吗", ok: false, reason: question }
  - { quote: "通过", gate_type: reopen_baseline, ok: false, reason: keyword-mismatch }
  - { quote: "可以", ok: true, reason: ok }
  - { quote: "就这样", ok: true, reason: ok }
  - { quote: "按这个方案", ok: true, reason: ok }
  - { quote: "没问题", ok: true, reason: ok }
  - { quote: "无异议", ok: true, reason: ok }
  - { quote: "行", ok: true, reason: ok }
  - { quote: "确认，继续", ok: true, reason: ok }
  - { quote: "确认，不用一直询问", ok: true, reason: ok }
  - { quote: "可以", gate_type: reopen_baseline, ok: false, reason: keyword-mismatch }
  - { quote: "回退到实现", gate_type: defect_origin, origin: code, ok: true, reason: ok }
  - { quote: "回退到实现", gate_type: defect_origin, origin: req, ok: false, reason: keyword-mismatch }
  - { quote: "回退到实现", gate_type: accepted_arch, ok: false, reason: keyword-mismatch }
  - { quote: "打开基线", gate_type: reopen_baseline, ok: true, reason: ok }
  - { quote: "打开基线", ok: false, reason: no-verb }
  - { quote: "按建议", ok: true, reason: ok }
  - { quote: "就按建议", ok: true, reason: ok }
  - { quote: "听你的", ok: true, reason: ok }
  - { quote: "选a", ok: true, reason: ok }
  - { quote: "选 a", ok: true, reason: ok }
  - { quote: "a", ok: true, reason: ok }
  - { quote: "1", ok: true, reason: ok }
  - { quote: "按建议", gate_type: reopen_baseline, ok: false, reason: keyword-mismatch }
  - { quote: "a", gate_type: defect_origin, origin: code, ok: false, reason: keyword-mismatch }
  # Naming the rollback or the unseal is not agreeing to it.
  - { quote: "不要解除密封", gate_type: reopen_baseline, ok: false, reason: negation }
  - { quote: "先别解除密封，再想想", gate_type: reopen_baseline, ok: false, reason: negation }
  - { quote: "等等再打开基线", gate_type: reopen_baseline, ok: false, reason: hesitation }
  - { quote: "不要回退到需求", gate_type: defect_origin, origin: req, ok: false, reason: negation }
  - { quote: "没必要回退到实现", gate_type: defect_origin, origin: code, ok: false, reason: negation }
  - { quote: "回退到实现也许更好", gate_type: defect_origin, origin: code, ok: false, reason: hesitation }

  # --- verbs alone ---------------------------------------------------------
  - { quote: "全签", ok: true, reason: ok }
  - { quote: "lgtm", ok: true, reason: ok }
  - { quote: "LGTM", ok: true, reason: ok }
  - { quote: "Lgtm", ok: true, reason: ok }

  # --- trailing punctuation is noise, not meaning ---------------------------
  - { quote: "确认。", ok: true, reason: ok }
  - { quote: "确认！", ok: true, reason: ok }
  - { quote: "确认.", ok: true, reason: ok }
  - { quote: "确认!!!", ok: true, reason: ok }
  - { quote: "确认。。。", ok: true, reason: ok }
  - { quote: "确认～", ok: true, reason: ok }
  - { quote: "确认~", ok: true, reason: ok }
  - { quote: "  确认  ", ok: true, reason: ok }

  # --- NFKC folds the full-width forms -------------------------------------
  - { quote: "ＬＧＴＭ", ok: true, reason: ok }
  - { quote: "同意，sealed", ok: true, reason: ok }
  - { quote: "确认：提测", ok: true, reason: ok }
  - { quote: "确认, accepted", ok: true, reason: ok }
  - { quote: "确认:aligned", ok: true, reason: ok }

  # --- qualifiers the grammar allows ---------------------------------------
  - { quote: "确认 plan", ok: true, reason: ok }
  - { quote: "确认 方案", ok: true, reason: ok }
  - { quote: "确认 拆解", ok: true, reason: ok }
  - { quote: "确认 基线", ok: true, reason: ok }
  - { quote: "确认 提测", ok: true, reason: ok }
  - { quote: "同意 sealed", ok: true, reason: ok }
  - { quote: "确认 resolved", ok: true, reason: ok }
  - { quote: "lgtm 提测", ok: true, reason: ok }
  - { quote: "LGTM  提测", ok: true, reason: ok }
  - { quote: "确认 sealed accepted", ok: true, reason: ok }
  - { quote: "确认 sealed, accepted", ok: true, reason: ok }

  # --- destructive gates need their keyword --------------------------------
  - { quote: "确认 解除密封", gate_type: reopen_baseline, ok: true, reason: ok }
  - { quote: "确认 reopen", gate_type: reopen_baseline, ok: true, reason: ok }
  - { quote: "确认", gate_type: reopen_baseline, ok: false, reason: keyword-mismatch }
  - { quote: "确认 基线", gate_type: reopen_baseline, ok: false, reason: keyword-mismatch }
  - { quote: "确认 origin=req", gate_type: defect_origin, origin: req, ok: true, reason: ok }
  - { quote: "确认 origin=arch", gate_type: defect_origin, origin: arch, ok: true, reason: ok }
  - { quote: "确认", gate_type: defect_origin, origin: code, ok: false, reason: keyword-mismatch }
  - { quote: "确认 origin=test", gate_type: defect_origin, origin: test, ok: false, reason: unparsed-tail }
  # A plain gate does not demand a keyword.
  - { quote: "确认", gate_type: step_confirm, ok: true, reason: ok }

  # --- questions -----------------------------------------------------------
  - { quote: "确认吗", ok: false, reason: question }
  - { quote: "同意么", ok: false, reason: question }
  - { quote: "确认嘛", ok: false, reason: question }
  - { quote: "确认呢", ok: false, reason: question }
  - { quote: "是否确认", ok: false, reason: question }
  - { quote: "能否确认", ok: false, reason: question }
  - { quote: "可否确认", ok: false, reason: question }
  - { quote: "要不要确认", ok: false, reason: question }
  - { quote: "确认?", ok: false, reason: question }

  # --- refusals and hesitations --------------------------------------------
  - { quote: "不确认", ok: false, reason: no-verb }
  - { quote: "没确认", ok: false, reason: no-verb }
  - { quote: "别确认", ok: false, reason: no-verb }
  - { quote: "确认一下", ok: false, reason: unparsed-tail }
  - { quote: "同意了", ok: true, reason: ok }
  - { quote: "确认吧", ok: false, reason: unparsed-tail }
  - { quote: "确认 待定", ok: false, reason: unparsed-tail }
  - { quote: "确认，但是", ok: false, reason: unparsed-tail }
  - { quote: "lgtm later", ok: false, reason: unparsed-tail }
  - { quote: "确认 hold", ok: false, reason: unparsed-tail }
  - { quote: "lgtm, not yet", ok: false, reason: unparsed-tail }
  - { quote: "确认 先等等", ok: false, reason: unparsed-tail }
  - { quote: "我确认", ok: false, reason: no-verb }
  - { quote: "确认确认", ok: false, reason: unparsed-tail }

  # --- words that are not confirmations ------------------------------------
  - { quote: "", ok: false, reason: no-verb }
  - { quote: "   ", ok: false, reason: no-verb }
  - { quote: "ok", ok: false, reason: no-verb }
  - { quote: "OK", ok: false, reason: no-verb }
  - { quote: "ＯＫ", ok: false, reason: no-verb }
  - { quote: "好", ok: false, reason: no-verb }
  - { quote: "好的", ok: false, reason: no-verb }
  - { quote: "continue", ok: false, reason: no-verb }
  - { quote: "go", ok: false, reason: no-verb }
  - { quote: "驳回", ok: false, reason: no-verb }
  - { quote: "驳回 origin=code", ok: false, reason: no-verb }

  # --- injection shapes: a stray invisible character is not a signoff ------
  # NFKC leaves zero-width characters in place, so the verb no longer matches
  # and the quote is refused rather than silently accepted.
  - { quote: "确​认", ok: false, reason: no-verb }
  - { quote: "​确认", ok: false, reason: no-verb }
  - { quote: "确认​", ok: false, reason: unparsed-tail }
  - { quote: "确认 👍", ok: false, reason: unparsed-tail }
  - { quote: "👍", ok: false, reason: no-verb }
  - { quote: "确认\norigin=code", gate_type: defect_origin, origin: code, ok: true, reason: ok }
  - { quote: "确认\t提测", ok: true, reason: ok }

  # --- more zero-width and separator tricks (2026-10-17, Python/Go 对拍过) --
  # U+FEFF/BOM, U+2060 word joiner, U+200D ZWJ: all survive NFKC and break
  # the verb, which must read as a refusal — not as a confirmation someone
  # "mostly" typed. U+2062/U+2061 repeat the trick on the 同意/LGTM verbs
  # without reusing U+200B from the section above. The invisible chars are
  # \uXXXX escapes so a reviewer can see exactly what is being tested.
  - { quote: "\uFEFF确认", ok: false, reason: no-verb }
  - { quote: "确\u2060认", ok: false, reason: no-verb }
  - { quote: "确认\u200D", ok: false, reason: unparsed-tail }
  - { quote: "同\u2062意", ok: false, reason: no-verb }
  - { quote: "LG\u2061TM", ok: false, reason: no-verb }
  # U+00A0 NBSP is a separator, not a verb-breaker: NFKC folds it to a
  # plain space, so the verb still matches and only the qualifier remains.
  - { quote: "确认\u00A0提测", ok: true, reason: ok }

  # --- emoji are not qualifiers --------------------------------------------
  # U+2728 sparkle prefix breaks the verb; visible emoji after a matched
  # verb are an unparsed tail. \uXXXX for the task probes, literal for the
  # rest, so the invisible/invisible boundary stays reviewable.
  - { quote: "\u2728确认", ok: false, reason: no-verb }
  - { quote: "确认 🎉", ok: false, reason: unparsed-tail }
  - { quote: "LGTM 🚀", ok: false, reason: unparsed-tail }
  - { quote: "同意 \u2705", ok: false, reason: unparsed-tail }
  - { quote: "确认 🎉🚀", ok: false, reason: unparsed-tail }

  # --- full-width forms NFKC does fold ------------------------------------
  # The whole qualifier in full-width (origin＝code), the verb in full-width
  # with a qualifier, and U+3000 as the separator — all fold to the ASCII
  # grammar and confirm.
  - { quote: "确认 ｏｒｉｇｉｎ＝ｃｏｄｅ", gate_type: defect_origin, origin: code, ok: true, reason: ok }
  - { quote: "ＬＧＴＭ 提测", ok: true, reason: ok }
  - { quote: "ＬＧＴＭ。", ok: true, reason: ok }
  - { quote: "确认　提测", ok: true, reason: ok }
  - { quote: "同意　sealed", ok: true, reason: ok }

reject:
  - { quote: "驳回", ok: true }
  - { quote: "驳回 origin=code", ok: true }
  - { quote: "驳回。", ok: true }
  - { quote: "确认", ok: false }
  - { quote: "驳回吗", ok: false }
  - { quote: "驳回一下", ok: false }
  - { quote: "", ok: false }

