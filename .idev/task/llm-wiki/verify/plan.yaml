schema_version: 1
feature: llm-wiki
mode: test
accepted: false
goal: "交付票往下走时，用不可变来源、索引和内核 schema 这三层，把基线、方案、代码、用例和经验对到同一说法。校准是对照来源标出一致或漂移。两处说法冲突就停。"
non_goal: "不安装 nvk/llm-wiki、llmwikify 或其他 wiki 引擎。不建向量库。不做健康分。不把 idev 技能正文再编译成一份 wiki。不收录个人或团队研究笔记。不改产品控制台的 Agent 知识库。不把耗时下降写成验收。不把校准加进 check-feature 作为新的阶段门禁。不把 lessons 或 realign 的结果抄进索引，也不替换这两套。"
baseline_revision: 1
unproven_surfaces:
  - dimension: concurrency
    reason: 单进程脚本，没有共享可变状态
    risk: low
  - dimension: performance
    reason: 基线不把耗时写成通过条件
    risk: low
  - dimension: ui-prototype
    reason: 没有界面
    risk: low
entry:
  kind: diff
  intent_ref: "HEAD"
impact_candidates:
  - path: scripts/claims.py
    hop: 0
    include: true
  - path: scripts/test_claims.py
    hop: 0
    include: true
  - path: references/claim-index.md
    hop: 0
    include: true
