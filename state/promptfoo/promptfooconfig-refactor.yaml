- description: 'C-3 idev-coder: pure structural refactor keeps behavior (exec guard)'
  vars:
    brief: "票目录: docs/task/probe\n仓根: /Users/wangwei794/go/src/github.com/idev\nfeature:\
      \ probe / stage: code / risk_tier: P1\n本步: code-pass  kind=deliver.code_pass\
      \  label=纯结构重构(R2)\nattempt: 1\n必读: /Users/wangwei794/go/src/github.com/idev/conventions/coding.md\n\
      IDEV_ROOT: /Users/wangwei794/go/src/github.com/idev\n禁止: 写 sealed/accepted/aligned/resolved;改密封基线正文\n\
      任务: 模块 fixture_r2.py 的 parse_confirm 有三段复制粘贴的前缀判断,做一次纯结构重构(提取公共判断,消除重复),行为必须保持不变。\n\
      行为契约: parse_confirm(text) 返回 CONFIRM/REJECT;前缀 全签/确认/同意 后跟结尾或允许分隔符才判 CONFIRM;公开函数名与返回值不得变。\n\
      护栏 guard_r2.py 已就位:重构前后它必须全绿且输出逐字节一致。\n\n模块 v1(fixture_r2.py 全文):\n```python\n\
      \"\"\"R2 纯结构重构探针的 v1 模块(故意保留三段复制粘贴)。\n\n行为契约(重构必须保持):\n  parse_confirm(text)\
      \ -> \"CONFIRM\" | \"REJECT\"\n  - 先去掉首尾空白;\n  - 以前缀 全签/确认/同意 开头、且紧随前缀的下一个字符是结尾或允许分隔符,判\
      \ CONFIRM;\n  - 其余一律 REJECT。\n允许分隔符集:。！，：:；;、 空格 制表符\n公开 API 与返回值不得改变。\n\"\"\
      \"\n\n\ndef parse_confirm(text):\n    t = text.strip()\n    if t.startswith(\"\
      全签\"):\n        rest = t[2:]\n        if rest == \"\" or rest[0] in \"。！，：:；;、\
      \ \\t\":\n            return \"CONFIRM\"\n    if t.startswith(\"确认\"):\n   \
      \     rest = t[2:]\n        if rest == \"\" or rest[0] in \"。！，：:；;、 \\t\":\n\
      \            return \"CONFIRM\"\n    if t.startswith(\"同意\"):\n        rest\
      \ = t[2:]\n        if rest == \"\" or rest[0] in \"。！，：:；;、 \\t\":\n       \
      \     return \"CONFIRM\"\n    return \"REJECT\"```\n\n护栏(guard_r2.py 全文):\n\
      ```python\n\"\"\"R2 行为护栏:对 parse_confirm 的固定用例集逐条比对预期。\n\n运行方式:与本文件同目录放一个 fixture_r2.py,然后\
      \ python3 guard_r2.py。\n退出码 0 = 全部用例符合预期;非 0 = 存在行为差异。\n输出按用例顺序逐行打印,末行 fails=N\
      \ —— 重构前后输出必须逐字节一致。\n\"\"\"\nimport sys\n\nimport fixture_r2  # 与被测模块同目录运行\n\
      \nCASES = [\n    (\"全签\", \"CONFIRM\"),\n    (\"全签。\", \"CONFIRM\"),\n    (\"\
      全签！\", \"CONFIRM\"),\n    (\"全签，origin=code\", \"CONFIRM\"),\n    (\"全签 origin=code\"\
      , \"CONFIRM\"),\n    (\"全签x\", \"REJECT\"),\n    (\"全签全签\", \"REJECT\"),\n \
      \   (\"确认\", \"CONFIRM\"),\n    (\"确认:\", \"CONFIRM\"),\n    (\"确认：\", \"CONFIRM\"\
      ),\n    (\"确认；\", \"CONFIRM\"),\n    (\"确认 origin=code\", \"CONFIRM\"),\n  \
      \  (\"确认x\", \"REJECT\"),\n    (\"同意\", \"CONFIRM\"),\n    (\"同意。\", \"CONFIRM\"\
      ),\n    (\"同意\\torigin=code\", \"CONFIRM\"),\n    (\"同意x\", \"REJECT\"),\n \
      \   (\"  全签。  \", \"CONFIRM\"),\n    (\"\", \"REJECT\"),\n    (\"拒绝\", \"REJECT\"\
      ),\n    (\"全签、\", \"CONFIRM\"),\n    (\"确认、origin=code\", \"CONFIRM\"),\n]\n\
      \n\ndef main():\n    fails = 0\n    for text, want in CASES:\n        got =\
      \ fixture_r2.parse_confirm(text)\n        ok = got == want\n        if not ok:\n\
      \            fails += 1\n        print(f\"{'ok' if ok else 'FAIL'} {text!r}\
      \ -> {got} (want {want})\")\n    print(f\"fails={fails}\")\n    return 0 if\
      \ fails == 0 else 1\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())```\n\
      \n回报: 按你定义里的回报格式,STATUS + EVIDENCE 必填;并把重构后的完整模块(单文件可独立运行,不含 guard)粘贴为回报末尾唯一的\
      \ ```python 代码块\n"
