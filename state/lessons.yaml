schema_version: 1
lessons:
- id: L1
  status: authoritative
  event: verified
  scope: 引入 joypaas-access-layer-starter 的本机控制台（SNAPSHOT 装进本地仓库后再启动）
  symptom: 已登记的 /v1/** 返回 Spring 默认 404（JSON 含 timestamp、status、error、path）。下游同一路径有数据。本轮启动日志没有
    GatewayFilter registered。
  evidence: 同一 GET 在下游 200、接入层 404。同进程其它已登记路由也是 404。上一轮启动日志有 GatewayFilter registered，重启用的是后装的
    starter jar。运行 classpath 只有 starter 自身 jar，没有 springdoc。AccessLayerAutoConfiguration
    类级 @ConditionalOnClass(OpenAPI.class)，不满足则 @Import 的网关整段不装配。mvn dependency:tree
    警告 starter POM invalid：component-cache-r2m 缺少 version。源码父 POM 已有这条 dependencyManagement，已安装的父
    POM 没有。
  action: 先对同一请求的浏览器入口、接入层端口、下游。接入层是 Spring 默认 404 且多条已登记路由一起 404 时，先看本轮启动日志有没有 GatewayFilter
    registered。没有则查运行 classpath 是否含 springdoc（io.swagger.v3.oas.models.OpenAPI）。没有则跑
    dependency:tree：POM invalid 且 component-cache-r2m 缺 version，就对已安装父 POM 是否含这条 dependencyManagement。源码有、仓库里的父
    POM 没有，就是只装了 starter。先 install 父 POM，再 install starter，用新 classpath 重启。绿的标志是 GatewayFilter
    registered，且未带登录态的同一请求从 404 变成网关 401。
  outcome: 装上含版本管理的父 POM 后，依赖树出现 springdoc，invalid 警告消失。重启后日志有 GatewayFilter registered。GET
    /v1/task 由网关处理，未登录为 401，不再是 Spring 默认 404。
  not_when: 只有一条路由 404、其它已登记路由正常时，先对 routes yaml 和匹配，不要先判 POM。响应体不是 Spring 默认 404
    JSON 时，先对下游。启动日志已有 GatewayFilter registered 且响应是 401 时，网关已装配，转鉴权。dependency:tree
    没有 invalid、classpath 已有 springdoc 时不适用本条。
  from_feature: ''
  confirmed_by: wangwei794
  repro: state/lessons/L1-repro.md
